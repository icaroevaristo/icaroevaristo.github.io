name: Gerar icones PNG

on:
  push:
    branches: [main]
    paths:
      - 'financas/icons/icon.svg'
      - '.github/workflows/icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Converter SVG em PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-dejavu-core
          rsvg-convert -w 192 -h 192 financas/icons/icon.svg -o financas/icons/icon-192.png
          rsvg-convert -w 512 -h 512 financas/icons/icon.svg -o financas/icons/icon-512.png
          ls -la financas/icons
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add financas/icons/*.png
          if git diff --cached --quiet; then echo 'sem mudancas'; exit 0; fi
          git commit -m "Gerar icones PNG a partir do SVG"
          git push
